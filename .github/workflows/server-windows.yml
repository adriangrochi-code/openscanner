name: TismaServer.exe (Windows)

on:
  push:
    paths:
      - "server/**"
      - "tools/**"
      - ".github/workflows/server-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-contrib-python-headless open3d pyinstaller

      - name: Pruebas del pipeline (sin COLMAP)
        run: |
          python tools/test_reconstruct.py
          python tools/test_tisma_scan.py

      - name: Compilar TismaServer.exe
        working-directory: server
        run: pyinstaller --noconfirm --clean TismaServer.spec

      - name: Compilar tisma_scan.exe (nodos de Tisma Cloud)
        working-directory: server
        run: pyinstaller --noconfirm TismaScan.spec

      - name: tisma_scan.exe responde
        working-directory: server/dist
        run: .\tisma_scan.exe --help

      - name: Autoprueba del .exe en Windows
        working-directory: server/dist
        env:
          PYTHONIOENCODING: ""      # sin ayudas: debe funcionar con la consola cp1252 por defecto
        run: .\TismaServer.exe --selftest

      - name: Paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item server/dist/TismaServer.exe out/
          Copy-Item server/dist/tisma_scan.exe out/
          Copy-Item server/README.md out/LEEME.md
          Copy-Item server/tisma_server.example.json out/

      - uses: actions/upload-artifact@v4
        with:
          name: TismaServer-windows
          path: out/
          retention-days: 30

      # The scan node of Tisma Cloud with all it needs, in one folder (tisma-scan, unpacked next to tisma-cloud.exe):
      # tisma_scan.exe and, from their official releases, COLMAP 3.9.1 (BSD-3-Clause; the 4.x changed the options the
      # pipeline uses) and OpenMVS (AGPL-3.0, unmodified, run as a separate program). tisma_scan.exe finds them in
      # colmap/ and openmvs/ by itself.
      - name: Paquete del nodo de escaneo (tisma-scan)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $pkg = "scan-out/tisma-scan"
          New-Item -ItemType Directory -Force "$pkg/licenses", dl | Out-Null
          Copy-Item server/dist/tisma_scan.exe $pkg/
          Invoke-WebRequest "https://github.com/colmap/colmap/releases/download/3.9.1/COLMAP-3.9.1-windows-cuda.zip" -OutFile dl/colmap.zip
          Invoke-WebRequest "https://github.com/cdcseacave/openMVS/releases/download/v2.4.0/OpenMVS_Windows_x64.zip" -OutFile dl/openmvs.zip
          Expand-Archive dl/colmap.zip dl/colmap
          Expand-Archive dl/openmvs.zip dl/openmvs
          # Each zip has its own layout: the folder with COLMAP.bat, and the one with DensifyPointCloud.exe.
          $colmap = (Get-ChildItem dl/colmap -Recurse -Filter COLMAP.bat | Select-Object -First 1).Directory
          $mvs = (Get-ChildItem dl/openmvs -Recurse -Filter DensifyPointCloud.exe | Select-Object -First 1).Directory
          if (-not $colmap -or -not $mvs) { Get-ChildItem -Recurse dl | Select-Object -First 60 FullName; throw "unexpected layout" }
          # Every licence and notice file of both releases (Qt, Boost, CGAL, OpenCV, the CUDA runtime... ship inside
          # them), with its path in the release, before only the program folders are moved into the package.
          function notices($from, $to) {
            $root = (Resolve-Path $from).Path
            $found = Get-ChildItem $from -Recurse -File | Where-Object { $_.Name -match '^(LICEN[CS]E|COPYING|NOTICE)|licen[cs]e' }
            foreach ($f in $found) {
              $dest = Join-Path $to $f.FullName.Substring($root.Length).TrimStart('\', '/')
              New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
              Copy-Item $f.FullName $dest
            }
            "{0}: {1} licence/notice files" -f $to, @($found).Count
          }
          notices dl/colmap "$pkg/licenses/colmap-release"
          notices dl/openmvs "$pkg/licenses/openmvs-release"
          Move-Item $colmap.FullName "$pkg/colmap"
          Move-Item $mvs.FullName "$pkg/openmvs"
          # The releases ship no notices for the libraries inside them: every bundled DLL is mapped to its library
          # (server/third_party/dlls.csv) and its licence text goes in licenses/third-party/, with the list in
          # licenses/BUNDLED_DLLS.txt. A DLL with no library in the table fails the job.
          python server/third_party/check_bundled.py $pkg
          if ($LASTEXITCODE -ne 0) { throw "bundled DLLs without a licence" }
          # Their licenses, from the source of those same versions.
          function license($base, $out) {
            foreach ($name in "COPYING.txt", "LICENSE.txt", "LICENSE", "COPYING") {
              try { Invoke-WebRequest "$base/$name" -OutFile $out; return } catch { }
            }
            throw "no license file at $base"
          }
          license "https://raw.githubusercontent.com/colmap/colmap/3.9.1" "$pkg/licenses/COLMAP-BSD-3-Clause.txt"
          license "https://raw.githubusercontent.com/cdcseacave/openMVS/v2.4.0" "$pkg/licenses/OpenMVS-AGPL-3.0.txt"
          if (-not (Select-String -Path "$pkg/licenses/COLMAP-BSD-3-Clause.txt" -Pattern "Redistribution" -Quiet)) {
            throw "the COLMAP licence is not BSD-3-Clause"
          }
          if (-not (Select-String -Path "$pkg/licenses/OpenMVS-AGPL-3.0.txt" -Pattern "AFFERO" -Quiet)) {
            throw "the OpenMVS licence is not the AGPL-3.0"
          }
          # AGPL-3.0: the corresponding source of OpenMVS travels with its programs.
          New-Item -ItemType Directory -Force "$pkg/source" | Out-Null
          Invoke-WebRequest "https://github.com/cdcseacave/openMVS/archive/refs/tags/v2.4.0.zip" -OutFile "$pkg/source/openMVS-2.4.0-source.zip"
          if ((Get-Item "$pkg/source/openMVS-2.4.0-source.zip").Length -lt 1MB) { throw "the OpenMVS source zip is too small" }
          @"
          tisma-scan: the 3D scans of Tisma Scanner on a computing node of Tisma Cloud.
          Unpack this folder next to tisma-cloud.exe; the node finds tisma_scan.exe by itself.

          COLMAP 3.9.1 (colmap/): BSD-3-Clause, licenses/COLMAP-BSD-3-Clause.txt.
            Official release, unmodified: https://github.com/colmap/colmap/releases/tag/3.9.1
          OpenMVS 2.4.0 (openmvs/): GNU Affero General Public License 3.0, licenses/OpenMVS-AGPL-3.0.txt.
            Official release, unmodified; its source: source/openMVS-2.4.0-source.zip
            (the same as https://github.com/cdcseacave/openMVS/tree/v2.4.0).
          licenses/colmap-release/ and licenses/openmvs-release/: the licence and notice files that came in
            those releases (for the libraries they include: Qt, Boost, CGAL, OpenCV, CUDA runtime...).
          "@ | Set-Content "$pkg/LEEME.txt" -Encoding utf8
          Get-ChildItem $pkg | Format-Table Name, Length
          "{0:N0} MB" -f ((Get-ChildItem $pkg -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      # tisma_scan runs bin\colmap.exe itself, not COLMAP.bat (the .bat passes the arguments one by one with %1, which
      # cuts the commas of the camera parameters), with what the .bat sets: lib\ on the PATH, lib\plugins for Qt.
      - name: COLMAP del paquete, sin COLMAP.bat
        working-directory: scan-out/tisma-scan/colmap
        shell: pwsh
        run: |
          Select-String -Path COLMAP.bat -Pattern "^set (PATH|QT_PLUGIN_PATH)="
          $env:PATH = "$PWD\lib;$env:PATH"
          $env:QT_PLUGIN_PATH = "$PWD\lib\plugins"
          # Whole output first: a pipe into Select-Object stops the program early and leaves $LASTEXITCODE empty.
          $out = & .\bin\colmap.exe help
          $code = $LASTEXITCODE
          $out | Select-Object -First 2
          if ($code -ne 0) { throw "colmap.exe help: $code" }

      - name: tisma_scan.exe --check (con COLMAP y OpenMVS del paquete)
        working-directory: scan-out/tisma-scan
        run: |
          .\tisma_scan.exe --check
          if ($LASTEXITCODE -ne 0) { throw "not ready" }

      - uses: actions/upload-artifact@v4
        with:
          name: TismaScan-windows
          path: scan-out/
          retention-days: 30

      # The whole pipeline with the programs of the package, on a machine without an NVIDIA card (as the runners are):
      # the synthetic 40 x 30 x 20 mm box up to pieza.stl.
      - name: Escaneo completo con el paquete (Windows, sin placa NVIDIA)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/make_synthetic_scan.py scan.zip --views 16 --size 640x480
          $exe = (Resolve-Path scan-out/tisma-scan/tisma_scan.exe).Path
          & $exe scan.zip -o scan-result --summary summary.json
          $code = $LASTEXITCODE
          Get-Content summary.json
          if (Test-Path scan-result/log.txt) { Get-Content scan-result/log.txt -Tail 60 }
          if ($code -ne 0) { throw "tisma_scan failed ($code)" }
          $dims = (Get-Content summary.json | ConvertFrom-Json).dimensions_mm_xyz | Sort-Object -Descending
          $want = 40, 30, 20
          for ($i = 0; $i -lt 3; $i++) { if ([math]::Abs($dims[$i] / $want[$i] - 1) -gt 0.15) { throw "measures $dims" } }
          "pieza.stl: $dims mm"
