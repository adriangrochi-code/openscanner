name: App Android (compilar y pruebas)

on:
  push:
    paths:
      - "app/**"
      - "tools/fake_tisma_cloud.py"
      - "tools/make_scan_mat.py"
      - "tools/make_tester_kit.py"
      - "docs/PROBAR.md"
      - "docs/TESTING.md"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/app-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The tests run tools/fake_tisma_cloud.py, which checks the library's Ed25519 signatures with `cryptography`.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python del servidor de prueba
        run: pip install -q cryptography

      - name: Compilar y pruebas de unidad
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: tisma-scanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # The kit for testers: the APK, the short instructions and the mat as PDF in every paper size.
      - name: Kit para testers
        run: |
          pip install -q numpy opencv-contrib-python-headless pillow
          python tools/make_tester_kit.py app/build/outputs/apk/debug/app-debug.apk --version "0.1.0-${GITHUB_SHA::7}" --out kit

      - uses: actions/upload-artifact@v4
        with:
          name: tisma-scanner-kit
          path: kit/*.zip
          compression-level: 0
          retention-days: 30
