name: App en el emulador (prueba de humo)

# The first steps of docs/PROBAR.md on an Android 13 emulator: install the APK of the tester kit, open it, the main
# screen without a crash, ⚙ → Nube → Entrar (tools/emulator_smoke.py). The app only carries arm64 libraries; the
# x86_64 images from Android 11 on translate them. Screenshots and logcat in the artifact.

on:
  push:
    paths:
      - "app/**"
      - "tools/emulator_smoke.py"
      - ".github/workflows/app-emulator.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar el APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prueba de humo en el emulador (Android 13)
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: python3 tools/emulator_smoke.py app/build/outputs/apk/debug/app-debug.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke/
          retention-days: 14
