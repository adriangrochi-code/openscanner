name: Release del kit de testers

# Publishes the testers' kit (APK + instructions + the mat as PDF) as a GitHub release, run by hand from scanner/next:
# it builds the APK, runs the unit tests, makes the kit and publishes it with the notes in docs/releases/<version>.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (p. ej. 0.1.0-beta.1); las notas están en docs/releases/<versión>.md"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Notas de la versión
        run: test -s "docs/releases/${{ inputs.version }}.md" || { echo "falta docs/releases/${{ inputs.version }}.md"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python del servidor de prueba y del kit
        run: pip install -q cryptography numpy opencv-contrib-python-headless pillow

      - name: Compilar y pruebas de unidad
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Kit para testers
        run: python tools/make_tester_kit.py app/build/outputs/apk/debug/app-debug.apk --version "${{ inputs.version }}" --out kit

      - name: Publicar la release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: scanner-v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Tisma Scanner ${{ inputs.version }}
          body_path: docs/releases/${{ inputs.version }}.md
          prerelease: true
          files: kit/*.zip
